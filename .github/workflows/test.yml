name: Test
on:
  push:
    paths:
      - gradle/
      - src/
      - build.gradle.kts
      - gradle.properties
      - settings.gradle.kts
  pull_request:
    paths:
      - gradle/
      - src/
      - build.gradle.kts
      - gradle.properties
      - settings.gradle.kts

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Set up JDK
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Run tests
        run: ./gradlew test