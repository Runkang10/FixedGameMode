name: Test
on:
  push:
    paths: [ gradle/**, src/**, '*.kts', gradle.properties ]
  pull_request:
    paths: [ gradle/**, src/**, '*.kts', gradle.properties ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Run tests
        run: ./gradlew test