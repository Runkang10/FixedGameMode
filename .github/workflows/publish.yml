name: Publish
on:
  push:
    branches: [ main ]
    paths: [ README.md ]
  release:
    types: [ published ]

jobs:
  publish-plugin:
    name: Publish plugin
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Set up JDK
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Publish to Modrinth
        env:
          RELEASE: true
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION: ${{ github.event.release.tag_name }}
          CHANGELOG: ${{ github.event.release.body }}
        run: ./gradlew modrinth
  publish-description:
    name: Publish description
    if: always() && (needs.publish-plugin.result == 'success' || needs.publish-plugin.result == 'skipped')
    runs-on: ubuntu-latest
    needs: publish-plugin
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Set up JDK
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Update description (Modrinth)
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew modrinthSyncBody --no-configuration-cache --no-build-cache