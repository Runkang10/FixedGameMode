[versions]
kotlin = "2.4.10"
kotlinx = "1.11.0"
compactMono = "2.2.0"
configurate = "4.2.0"

paperApi = "26.2.build.+"
minecraft = "26.2"
packetEvents = "2.13.0"

junit = "6.1.1"

shadow = "9.6.1"
run-task = "3.0.2"
resource-factory = "1.3.1"
minotaur = "2.9.0"
hangarPublish = "0.1.4"


[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinx-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx" }
compactMono = { module = "io.github.runkang10:compact-mono", version.ref = "compactMono" }
configurate-hocon = { module = "org.spongepowered:configurate-hocon", version.ref = "configurate" }
configurate-extra-kotlin = { module = "org.spongepowered:configurate-extra-kotlin", version.ref = "configurate" }

paperApi = { module = "io.papermc.paper:paper-api", version.ref = "paperApi" }
packetEvents = { module = "com.github.retrooper:packetevents-spigot", version.ref = "packetEvents" }

junit = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }


[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-task" }
resource-factory-paper = { id = "xyz.jpenilla.resource-factory-paper-convention", version.ref = "resource-factory" }
minotaur = { id = "com.modrinth.minotaur", version.ref = "minotaur" }
hangerPublish = { id = "io.papermc.hangar-publish-plugin", version.ref = "hangarPublish" }